[package]
name = "lfs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
cmac = "0.7"
crc32fast = "1.5.1"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
md-5 = "0.10"
md4 = "0.10"
nfsserve = "0.11.0"
object_store = { version = "0.14.1", features = ["aws"] }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "http2", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
