# GPUI's Android platform (wgpu/Vulkan, cosmic-text), vendored from
# https://github.com/longbridge/gpui-mobile (Apache-2.0, see LICENSE-APACHE;
# commit in UPSTREAM_COMMIT): `src/android/` and the modules it needs, minus
# the iOS backend, widgets and optional packages. gpui-pre has no Android
# backend of its own. Local changes are listed in README.md.
[package]
name = "gpui-android"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
raw-window-handle = "0.6"
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
libc = "0.2"
# Baseline `nativewindow` only: `api-level-31` would link API 31 symbols and
# fail to load on older Android versions.
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.11" }
accesskit_android = "0.7.5"
rustc-hash = "2"
uuid = { version = "1", features = ["v5"] }

[lints.rust]
# Upstream's optional packages (clipboard bridge, deep links, media session,
# offscreen rendering) are not vendored; their gated code stays compiled out.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("clipboard", "deeplink", "media_session", "offscreen"))'] }
