[package]
name = "vektor-exec"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
boa_engine = "0.21"
boa_gc = "0.21"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order intact across the VM boundary; the
# default map is a BTreeMap, which silently alphabetizes it.
serde_json = { version = "1", features = ["preserve_order"] }
# WHATWG-compliant URL parsing, so URL is not a hand-rolled regex.
url = "2"
# Real entropy for crypto.getRandomValues / randomUUID.
getrandom = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true

