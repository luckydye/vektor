# What the desktop and the mobile app share: the contract with the web UI they
# host (scripts, page messages), the origin policy and the browser sign-in.
# GPUI-free, since the two apps run different GPUI builds.
[package]
name = "vektor-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
