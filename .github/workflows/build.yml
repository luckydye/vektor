name: Build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifact:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build native N-API addons on each target platform so their architecture
      # matches the compiled Bun binary.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          bun i
          cd server && bun i

      - name: Build native image addon
        working-directory: server/native/image
        run: |
          bun i
          bun run build

      - name: Build native JavaScript runtime
        working-directory: server/native/exec
        run: |
          bun i
          bun run build

      - name: Build native embedding runtime
        working-directory: server/native/embedding
        run: |
          bun i
          bun run build

      - name: Build Astro assets + compile binary
        working-directory: server
        run: |
          bunx --bun astro build
          bun run ./build.ts
          mv ./vektor ./${{ inputs.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: server/${{ inputs.artifact }}
          if-no-files-found: error
