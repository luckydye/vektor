name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime rc.12 uses glibc's C23 conversion symbols, available in
          # the Ubuntu 24.04 runtime baseline.
          - runner: ubuntu-24.04
            artifact: vektor-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: vektor-linux-arm64
          - runner: macos-latest
            artifact: vektor-darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build native N-API addons on each target platform so their architecture
      # matches the compiled Bun binary.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          bun i
          cd app && bun i

      - name: Build native image addon
        working-directory: app/native/image
        run: |
          bun i
          bun run build

      - name: Build native JavaScript runtime
        working-directory: app/native/exec
        run: |
          bun i
          bun run build

      - name: Build native embedding runtime
        working-directory: app/native/embedding
        run: |
          bun i
          bun run build

      - name: Build Astro assets + compile binary
        working-directory: app
        run: |
          bunx --bun astro build
          bun run ./build.ts
          mv ./vektor ./${{ matrix.artifact }}

      # Bun's default x64 runtime requires AVX2, which a VM on a generic CPU
      # model does not expose. Ship an SSE4.2 build for those hosts too.
      - name: Compile baseline binary
        if: matrix.artifact == 'vektor-linux-x64'
        working-directory: app
        run: |
          bun run ./build.ts --baseline
          mv ./vektor-baseline ./vektor-linux-x64-baseline

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/${{ matrix.artifact }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'vektor-linux-x64'
        with:
          name: vektor-linux-x64-baseline
          path: app/vektor-linux-x64-baseline
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vektor-linux-x64
            artifacts/vektor-linux-x64-baseline
            artifacts/vektor-linux-arm64
            artifacts/vektor-darwin-arm64

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vektor-linux-x64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: vektor-linux-x64-baseline
          path: artifacts

      - name: Upload release binary
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            artifacts/vektor-linux-x64
            artifacts/vektor-linux-x64-baseline
          target: /tmp
          strip_components: 1
          overwrite: true

      - name: Install and restart Vektor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            if grep -qw avx2 /proc/cpuinfo; then
              binary=/tmp/vektor-linux-x64
            else
              binary=/tmp/vektor-linux-x64-baseline
            fi
            echo "installing $binary"
            chmod +x "$binary"
            # Startup smoke test, so a binary the CPU cannot run fails here
            # instead of replacing a working install with one that SIGILLs.
            "$binary" --version
            sudo install -m 755 "$binary" /usr/local/bin/vektor.new
            sudo mv -f /usr/local/bin/vektor.new /usr/local/bin/vektor
            rm -f /tmp/vektor-linux-x64 /tmp/vektor-linux-x64-baseline
            tmux send-keys -t 0:0.0 C-c
            sleep 1
            tmux send-keys -t 0:0.0 '/usr/local/bin/vektor serve --port 3000' Enter
