name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Built as its own job so deploy can start as soon as it finishes, without
  # waiting for the other platforms.
  build-linux-x64:
    uses: ./.github/workflows/build.yml
    with:
      # ONNX Runtime rc.12 uses glibc's C23 conversion symbols, available in
      # the Ubuntu 24.04 runtime baseline.
      runner: ubuntu-24.04
      artifact: vektor-linux-x64

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            artifact: vektor-linux-arm64
          - runner: macos-latest
            artifact: vektor-darwin-arm64
    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}

  release:
    needs: [build-linux-x64, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/vektor-linux-x64
            artifacts/vektor-linux-arm64
            artifacts/vektor-darwin-arm64

  deploy:
    needs: build-linux-x64
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vektor-linux-x64
          path: artifacts

      - name: Upload release binary
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: artifacts/vektor-linux-x64
          target: /tmp
          strip_components: 1
          overwrite: true

      - name: Install and restart Vektor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            sudo install -m 755 /tmp/vektor-linux-x64 /usr/local/bin/vektor.new
            sudo mv -f /usr/local/bin/vektor.new /usr/local/bin/vektor
            tmux send-keys -t 0:0.0 C-c
            sleep 1
            tmux send-keys -t 0:0.0 '/usr/local/bin/vektor serve --port 3000' Enter
