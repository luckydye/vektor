# https://taskfile.dev

version: "3"

env:
  VEKTOR_JOB_FETCH_ALLOW_PRIVATE: 1

tasks:
  setup:
    cmds:
      - bun i
      - cd app && bun i
      - task: native:image
      - task: native:exec
      - task: native:embedding

  native:image:
    desc: Build the native image addon (Rust → .node) for the host platform.
    dir: ./app/native/image
    sources:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**/*.rs
    generates:
      - ../../src/files/native/image-*.node
    cmds:
      - bun i
      - bun run build

  native:exec:
    desc: Build the native JavaScript runtime (Rust → .node) for the host platform.
    dir: ./app/native/exec
    sources:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**/*.rs
    generates:
      - ../../src/exec/native/exec-*.node
    cmds:
      - bun i
      - bun run build

  native:embedding:
    desc: Build the native local embedding runtime (Rust → .node) for the host platform.
    dir: ./app/native/embedding
    sources:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - build.ts
      - src/**/*.rs
      - licenses/**/*.txt
      - models/**/*
    generates:
      - ../../src/search/native/embedding-*.node
    cmds:
      - bun i
      - bun run build

  dev:
    deps: [setup]
    dir: ./app
    aliases: [d]
    dotenv:
      - ../.env
    env:
      DEV: true
      HOST: 0.0.0.0
      VEKTOR_SITE_URL: http://127.0.0.1:4321
      VEKTOR_API_URL: http://127.0.0.1:4321
      VEKTOR_COLLABORATION_HOST: 127.0.0.1:8080
      VEKTOR_NO_AUTH: "1"
    cmds:
      - defer: rm ../dev.log
      - bun --watch ./src/server.ts 2>&1 | tee ../dev.log

  preview:
    deps: [setup]
    dir: ./app
    dotenv:
      - ../.env.preview
    env:
      HOST: 0.0.0.0
    cmds:
      - task: compile
      - ./vektor serve
      
  build:
    deps: [setup]
    dir: ./app
    dotenv:
      - ../.env
    cmds:
      - bunx --bun astro build

  compile:
    dir: ./app
    desc: Compile full app with server into a single executable using bun.
    deps: [native:image, native:exec, native:embedding]
    dotenv:
      - ../.env
    cmds:
      - bunx --bun astro build
      - bun run ./build.ts

  start:
    dir: ./app
    desc: Start the compiled binary with the current runtime environment.
    dotenv:
      - ../.env
    env:
      VEKTOR_SITE_URL: http://127.0.0.1:8080
      VEKTOR_API_URL: http://127.0.0.1:8080
      VEKTOR_COLLABORATION_HOST: 127.0.0.1:8080
    cmds:
      - ./vektor serve --no-auth

  check:
    desc: Typecheck the project.
    deps: [check:tsc, check:biome]

  check:tsc:
    internal: true
    dir: ./app
    cmds:
      - |
        TSC_OUT=$(../node_modules/.bin/tsc --noEmit --pretty false 2>&1 | awk '
          /^[^[:space:]].*\([0-9]+,[0-9]+\): / { skip = ($0 ~ /node_modules/) ? 1 : 0 }
          !skip { print }
        ')
        echo "== tsc =="
        printf '%s\n' "$TSC_OUT"
        [ -z "$TSC_OUT" ]

  check:biome:
    dir: ./app
    cmds:
      - echo "== biome =="
      - bunx biome check --diagnostic-level=error {{.CLI_ARGS}}

  test:
    dir: ./app
    dotenv:
      - ../.env
    env:
      NODE_ENV: test
      VEKTOR_JOB_FETCH_ALLOW_PRIVATE: "0"
      # No extension store under test. The registry is a real outbound host, and
      # the route-access matrix in particular has no business reaching one — an
      # unreachable network would otherwise turn access cells into 5xx.
      VEKTOR_MARKETPLACE_URL: ""
      VEKTOR_TEST_S3_BUCKET: vektor-test
      VEKTOR_TEST_S3_ACCESS_KEY_ID: vektor
      VEKTOR_TEST_S3_SECRET_ACCESS_KEY: vektorsecret
    cmds:
      - bash -c './vektor serve --email-auth --port 4321 --host 127.0.0.1 & echo $! > /tmp/vektor-test-server.pid'
      - defer: kill $(cat /tmp/vektor-test-server.pid) 2>/dev/null || true
      - until curl -sf http://127.0.0.1:4321/ > /dev/null 2>&1; do sleep 0.1; done
      - bunx --bun vitest run --project server {{.CLI_ARGS}}

  s3:up:
    desc: >
      RustFS (S3-compatible) on :9010 for the S3 storage suite, with the test
      bucket created. `task test -- test/s3-storage.spec.ts` skips without it.
    cmds:
      - docker rm -f vektor-rustfs 2>/dev/null || true
      - >
        docker run -d --name vektor-rustfs -p 9010:9000
        -e RUSTFS_ACCESS_KEY=vektor -e RUSTFS_SECRET_KEY=vektorsecret
        rustfs/rustfs:latest
      - until curl -s -o /dev/null http://127.0.0.1:9010/; do sleep 0.2; done
      # RustFS does not create a bucket on first write, and Bun's S3 client
      # cannot sign a bucket-level request.
      - >
        curl -sf -X PUT http://127.0.0.1:9010/vektor-test
        --aws-sigv4 "aws:amz:us-east-1:s3" --user "vektor:vektorsecret"

  s3:down:
    cmds:
      - docker rm -f vektor-rustfs

  test:s3:
    desc: The S3 storage suite against the RustFS started by `task s3:up`.
    dir: ./app
    env:
      NODE_ENV: test
      VEKTOR_TEST_S3_ENDPOINT: http://127.0.0.1:9010
      VEKTOR_TEST_S3_BUCKET: vektor-test
      VEKTOR_TEST_S3_ACCESS_KEY_ID: vektor
      VEKTOR_TEST_S3_SECRET_ACCESS_KEY: vektorsecret
    cmds:
      - bunx --bun vitest run --project server test/s3-storage.spec.ts

  test:frontend:
    desc: Frontend component suite (Vitest + happy-dom). No server needed.
    dir: ./app
    cmds:
      # `--bun` matters: without it bunx starts vitest on Node, and the server
      # project loses the Bun global it needs to spawn the app.
      - bunx --bun vitest run --project frontend {{.CLI_ARGS}}

  test:wiki-roles:
    desc: Independent acceptance suite for SV_Wiki-Testfaelle_Rollen_2026-08-fk.pptx.
    dir: ./app
    dotenv:
      - ../.env
    env:
      NODE_ENV: test
    cmds:
      - bunx --bun vitest run --project server test/wiki-roles.acceptance.spec.ts
      - bunx --bun vitest run --project frontend test/wiki-roles.acceptance.vitest.ts

  test:e2e:
    desc: >
      Browser tests (Playwright). Builds the client, boots a disposable
      in-memory server, seeds it, and drives a real browser. Covers what
      happy-dom cannot — the canvas custom element above all.
    dir: ./app
    cmds:
      - bun ./test/e2e/run.ts {{.CLI_ARGS}}

  record:onboarding:
    desc: >
      Re-film the onboarding tour's clips into public/onboarding. Builds the
      client, boots a disposable in-memory server, seeds a space and drives the
      real sidebar. Run it after the document tree changes appearance. Needs
      ffmpeg.
    dir: ./app
    cmds:
      - bun ./scripts/record-onboarding.ts {{.CLI_ARGS}}

  docker:build:
    desc: Build a Docker image for the host architecture with the vektor binary baked in.
    deps: [compile]
    cmds:
      - docker build -t luckydye/vektor .

  release:
    desc: Bump the app patch version, commit it, and push the next date-based release tag.
    cmds:
      - |
        git fetch origin --tags

        tag="v$(date +%F)"
        if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
          n=1
          while git rev-parse --verify --quiet "refs/tags/$tag.$n" > /dev/null; do
            n=$((n + 1))
          done
          tag="$tag.$n"
        fi

        next_version="$(bun -e '
          const packageJson = await Bun.file("app/package.json").json();
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(packageJson.version);
          if (!match) throw new Error(`Expected a stable semantic version, received ${packageJson.version}`);
          console.log(`${match[1]}.${match[2]}.${Number(match[3]) + 1}`);
        ')"
        (cd app && bun pm pkg set version="$next_version")

        git add app/package.json
        git commit -m "release: $tag"
        git tag "$tag"
        git push origin HEAD "$tag"
